<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeatherMax Warning Desk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">WX</div>
          <div>
            <h1>WeatherMax Warning Desk</h1>
            <p id="caseSubtitle">Severe weather simulation</p>
          </div>
        </div>

        <div class="top-metrics" aria-label="desk metrics">
          <div class="metric">
            <span>Valid</span>
            <strong id="validTime">--</strong>
          </div>
          <div class="metric">
            <span>Desk Score</span>
            <strong id="deskScore">--</strong>
          </div>
          <div class="metric">
            <span>Hits</span>
            <strong id="hitCount">0</strong>
          </div>
          <div class="metric">
            <span>False Alarms</span>
            <strong id="falseAlarmCount">0</strong>
          </div>
          <div class="metric">
            <span>Misses</span>
            <strong id="missCount">0</strong>
          </div>
        </div>
      </header>

      <main class="desk-grid">
        <aside class="panel left-panel">
          <section class="control-section">
            <div class="section-heading">
              <h2>Case</h2>
              <span class="status-chip">SIM</span>
            </div>
            <label class="field-label" for="caseSelect">Scenario</label>
            <select id="caseSelect"></select>
            <button id="newRunBtn" class="desk-button" type="button">New Random Run</button>
            <div class="briefing" id="briefing"></div>
          </section>

          <section class="control-section">
            <div class="section-heading">
              <h2>Product Desk</h2>
              <span id="areaStatus" class="status-chip muted">No Area</span>
            </div>
            <label class="field-label" for="productSelect">Product</label>
            <select id="productSelect"></select>
            <div id="productOptions" class="product-options"></div>
            <div class="button-row">
              <button id="clearAreaBtn" class="ghost-button" type="button">Clear Area</button>
              <button id="issueBtn" class="primary-button" type="button">Issue Product</button>
            </div>
          </section>

          <section class="control-section">
            <div class="section-heading">
              <h2>Verification</h2>
              <span id="accuracyBadge" class="status-chip">72%</span>
            </div>
            <div class="score-bars">
              <div>
                <span>Polygon Skill</span>
                <meter id="polygonMeter" min="0" max="100" value="0"></meter>
              </div>
              <div>
                <span>Lead Time</span>
                <meter id="leadMeter" min="0" max="100" value="0"></meter>
              </div>
              <div>
                <span>Hazard Match</span>
                <meter id="hazardMeter" min="0" max="100" value="0"></meter>
              </div>
            </div>
          </section>
        </aside>

        <section class="map-panel">
          <div class="map-toolbar">
            <div class="layer-tabs" id="layerTabs" aria-label="weather layers">
              <button class="active" type="button" data-layer="radar">Radar</button>
              <button type="button" data-layer="velocity">Velocity</button>
              <button type="button" data-layer="spectrum">SW</button>
              <button type="button" data-layer="hail">MESH</button>
              <button type="button" data-layer="rotation">Rotation</button>
              <button type="button" data-layer="qpf">QPF</button>
              <button type="button" data-layer="satellite">Satellite</button>
              <button type="button" data-layer="model">Model</button>
              <button type="button" data-layer="reports">Reports</button>
            </div>
            <select id="tiltSelect" class="tilt-select" aria-label="radar tilt"></select>
            <select id="modelSelect" class="model-select"></select>
            <div class="time-buttons">
              <button id="stepBackBtn" type="button">-5</button>
              <button id="playBtn" type="button">Play</button>
              <button id="stepForwardBtn" type="button">+5</button>
            </div>
          </div>

          <div class="map-shell">
            <canvas id="weatherCanvas" aria-label="simulated severe weather map"></canvas>
            <div class="map-readouts">
              <div id="legend" class="legend"></div>
              <div id="cursorReadout" class="cursor-readout">--</div>
            </div>
          </div>

          <div class="timeline">
            <input id="timeRange" type="range" min="0" max="72" value="0" />
            <div class="timeline-status" id="timelineStatus">Current scan</div>
            <div class="timeline-labels" id="timelineLabels"></div>
          </div>
        </section>

        <aside class="panel right-panel">
          <section class="control-section model-section">
            <div class="section-heading">
              <h2>CAM Guidance</h2>
              <span id="modelMeta" class="status-chip">3 km</span>
            </div>
            <div id="modelSummary" class="model-summary"></div>
            <div id="modelGrid" class="model-grid"></div>
          </section>

          <section class="control-section">
            <div class="section-heading">
              <h2>Active Products</h2>
              <span id="activeCount" class="status-chip muted">0</span>
            </div>
            <div id="productList" class="product-list"></div>
          </section>

          <section class="control-section">
            <div class="section-heading">
              <h2>Reports</h2>
              <span id="reportCount" class="status-chip muted">0</span>
            </div>
            <div id="reportList" class="report-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
